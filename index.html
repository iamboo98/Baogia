<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo bảng báo giá</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Báo giá">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --blue:#1d4ed8; --blue-soft:#eef2ff; --ink:#111827; --text:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --bg:#f3f4f6; --danger:#dc2626; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{overscroll-behavior-y:none}
  body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  button{font:inherit;cursor:pointer}

  /* ---------- Thanh trên (1 dòng) ---------- */
  .topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .topbar .in{max-width:1100px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px}
  .topbar img{width:30px;height:30px;border-radius:8px;flex:none}
  .topbar h1{margin:0;font-size:17px;font-weight:700;color:var(--ink)}
  .tabs{flex:1;display:flex;gap:2px;padding:3px;background:var(--bg);border-radius:10px;max-width:260px;margin-left:auto}
  .tabs button{flex:1;border:0;background:none;padding:7px 6px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .icon-btn{flex:none;border:0;background:var(--blue-soft);color:var(--blue);font-size:22px;line-height:1;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
  @media(max-width:959px){ .topbar h1{display:none} }

  /* ---------- Bố cục ---------- */
  main{max-width:1100px;margin:0 auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .col{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start}
  @media(max-width:959px){ body[data-tab="edit"] .preview-col, body[data-tab="preview"] .editor-col{display:none}
    body[data-tab="preview"] .preview-col{animation:tabIn .25s ease} body[data-tab="edit"] .editor-col{animation:tabIn .25s ease} }
  @keyframes tabIn{from{opacity:0;transform:translateY(8px)}}
  .item.new{animation:itemIn .3s ease}
  @keyframes itemIn{from{opacity:0;transform:translateY(-6px)}}
  @media(min-width:960px){
    .tabs [data-tab="preview"]{display:none}
    .tabs{max-width:220px}
    main{grid-template-columns:440px minmax(0,1fr);align-items:start}
    .preview-col{position:sticky;top:70px}
  }

  .card{background:#fff;border-radius:var(--radius);padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .sec-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

  /* Ô nhập */
  .field{position:relative}
  .field + .field{margin-top:10px}
  .field label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
  input,textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;scroll-margin:80px 0 110px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--ink);min-width:0}
  input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
  textarea{resize:vertical;min-height:64px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two .field + .field{margin-top:0}

  /* Phần gấp gọn */
  details.card{padding:0}
  details summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
  details summary::-webkit-details-marker{display:none}
  details summary .t{font-weight:600;color:var(--ink)}
  details summary .s{flex:1;font-size:13px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  details summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 4px;transition:transform .15s}
  details[open] summary::after{transform:rotate(225deg);margin-top:4px}
  details .body{padding:0 14px 14px}

  /* Tab lịch sử */
  .history-col{display:none}
  body[data-tab="history"] .history-col{display:grid}
  body[data-tab="history"] .editor-col, body[data-tab="history"] .preview-col, body[data-tab="history"] .dock{display:none!important}
  body[data-tab="history"]{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  body[data-tab="history"] main{grid-template-columns:minmax(0,1fr);max-width:760px}
  body[data-tab="history"] .history-col{animation:tabIn .25s ease}

  /* Trạng thái lưu */
  .savebar{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .savebar .st{flex:1;font-size:13px;color:var(--muted);min-width:0}
  .savebar .st.ok{color:#15803d}
  .savebar .st.warn{color:#b45309}
  .btn.sm{min-height:38px;padding:8px 14px;font-size:14px}
  select{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--ink);min-width:0;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6b7280 50%),linear-gradient(135deg,#6b7280 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}

  /* Danh sách lịch sử */
  .search{position:relative}
  .chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip .n{opacity:.7;font-weight:500;margin-left:2px}
  .hstat{font-size:13px;color:var(--muted);margin:2px 2px 0}
  .hlist{display:grid;gap:8px}
  .hcard{background:#fff;border-radius:var(--radius);padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .hcard .h1{display:flex;align-items:baseline;gap:8px}
  .hcard .cname{flex:1;min-width:0;font-weight:700;color:var(--ink);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard .amt{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
  .hcard .meta{margin-top:3px;font-size:13px;color:var(--muted);line-height:1.5}
  .hcard .meta a{color:var(--blue);text-decoration:none;font-weight:600}
  .hcard .what{margin-top:4px;font-size:14px;color:var(--text)}
  .hcard .what small{color:var(--muted)}
  .badge{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
  .badge.on{background:#dcfce7;color:#15803d}
  .badge.soon{background:#fef3c7;color:#b45309}
  .badge.off{background:#f3f4f6;color:#6b7280}
  .hcard .acts{display:flex;gap:6px;margin-top:10px}
  .hcard .acts button,.hcard .acts a{flex:1;min-height:38px;border:0;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:14px;display:grid;place-items:center;text-decoration:none}
  .hcard .acts .del2{flex:none;width:44px;background:#fef2f2;color:var(--danger)}
  .hempty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px;line-height:1.6}
  .backup{display:flex;gap:8px}
  .backup .btn{flex:1}

  /* Hạng mục: 2 dòng / mục */
  .items{display:grid}
  .item{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
  .item:first-child{padding-top:2px}
  .item .r1{display:grid;grid-template-columns:20px minmax(0,1fr) auto 32px;align-items:center;gap:8px}
  .item .idx{width:20px;height:20px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700;display:grid;place-items:center}
  .item .lt{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
  .item .lt.zero{color:#c0c4cc;font-weight:500}
  .item .del{border:0;background:none;color:#9ca3af;font-size:22px;line-height:1;width:32px;height:36px;border-radius:8px}
  .item .del:hover{background:#fef2f2;color:var(--danger)}
  .item .r2{display:grid;grid-template-columns:54px 86px 12px minmax(0,1fr);align-items:center;gap:6px;padding-left:28px}
  .item .x{text-align:center;color:var(--muted);font-size:13px}
  .item input{padding:8px 9px;min-height:40px}
  .item input[data-k="name"]{font-weight:600;border-color:transparent;background:var(--bg)}
  .item input[data-k="name"]:focus{background:#fff}
  .add{width:100%;min-height:44px;margin-top:10px;border:1.5px dashed #c7d2fe;background:none;color:var(--blue);font-weight:600;padding:9px;border-radius:10px}
  .hint{font-size:12px;color:var(--muted);margin:8px 2px 0}

  /* Thanh dưới (1 dòng) */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .dock .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px}
  .dock .total{flex:1;min-width:0;line-height:1.15}
  .dock .total span{display:block;font-size:11px;color:var(--muted)}
  .dock .total b{font-size:18px;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
  .btn{border:0;border-radius:11px;min-height:44px;padding:11px 14px;transition:transform .1s;font-weight:600;white-space:nowrap}
  .btn.primary{background:var(--blue);color:#fff}
  .btn:active,.add:active,.icon-btn:active,.tabs button:active{transform:scale(.96)}
  @media(hover:none){ .item .del:hover{background:none;color:#9ca3af} }
  .btn.ghost{background:var(--blue-soft);color:var(--blue);padding:11px 12px}

  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
  .toast.show{opacity:1}


  /* ===== Hiệu ứng mở app ===== */
  #splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(150deg,#3b6ef5,#1739b8);color:#fff;transition:opacity .45s ease,transform .45s ease}
  #splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
  #splash .box{display:grid;justify-items:center;gap:18px}
  #splash svg{width:132px;height:132px;overflow:visible}
  #splash .paper{transform-origin:50% 60%;animation:paperIn .6s cubic-bezier(.34,1.56,.64,1) both}
  #splash .fold{animation:fade .3s .35s both}
  #splash .ln{transform-box:fill-box;transform-origin:left center;animation:lineIn .35s ease-out both}
  #splash .ln1{animation-delay:.4s}#splash .ln2{animation-delay:.5s}#splash .ln3{animation-delay:.58s}#splash .ln4{animation-delay:.66s}
  #splash .coin{transform-box:fill-box;transform-origin:center;animation:coinIn .6s .6s cubic-bezier(.34,1.56,.64,1) both}
  #splash h2{margin:0;font-size:26px;font-weight:800;letter-spacing:.5px;animation:up .5s .8s ease both}
  #splash p{margin:-10px 0 0;font-size:14px;opacity:.8;animation:up .5s .9s ease both}
  @keyframes paperIn{from{opacity:0;transform:translateY(24px) scale(.6) rotate(-8deg)}}
  @keyframes lineIn{from{transform:scaleX(0)}}
  @keyframes coinIn{from{opacity:0;transform:translate(30px,30px) scale(0) rotate(-200deg)}}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}}
  /* Các khung trượt lên lần lượt sau khi mở */
  body.enter .col > *{animation:up .45s ease both}
  body.enter .col > *:nth-child(2){animation-delay:.07s}
  body.enter .col > *:nth-child(3){animation-delay:.14s}
  body.enter .col > *:nth-child(4){animation-delay:.21s}
  body.enter .dock{animation:dockIn .45s .1s ease both}
  @keyframes dockIn{from{transform:translateY(100%)}}
  @media(prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

  /* ===== Phiếu báo giá (phần xuất ảnh / PDF) ===== */
  .preview-wrap{overflow:hidden;border-radius:10px;border:1px solid var(--line)}
  #sheet{width:900px;background:#fff;color:#1f2937;font-family:'Be Vietnam Pro',system-ui,sans-serif;transform-origin:top left;display:flex;flex-direction:column}
  #sheet.a4{min-height:1273px}   /* tỉ lệ A4 khi xuất PDF */
  #sheet .bar{height:10px;background:linear-gradient(90deg,#1d4ed8,#3b82f6)}
  #sheet .pad{padding:44px 56px 48px;flex:1;display:flex;flex-direction:column}
  #sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:32px}
  #sheet .from{max-width:460px}
  #sheet .from .name{font-size:24px;font-weight:800;color:#111827;line-height:1.3}
  #sheet .from .line{font-size:15px;color:#4b5563;margin-top:4px;line-height:1.5}
  #sheet .doc{text-align:right}
  #sheet .doc h1{margin:0;font-size:40px;font-weight:800;letter-spacing:2px;color:var(--blue);line-height:1}
  #sheet .doc .meta{margin-top:12px;font-size:15px;color:#4b5563;line-height:1.7}
  #sheet .doc .meta b{color:#111827;font-weight:600}
  #sheet .info{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:32px 0 28px;border:1px solid #dbe3f5;border-radius:12px;overflow:hidden}
  #sheet .info > div{padding:14px 18px;background:#f5f8ff}
  #sheet .info > div + div{border-left:1px solid #dbe3f5}
  #sheet .info .k{font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.6px}
  #sheet .info .v{font-size:17px;font-weight:600;color:#111827;margin-top:4px}
  #sheet .info.one{grid-template-columns:1fr}
  #sheet table{width:100%;border-collapse:separate;border-spacing:0;font-size:16px}
  #sheet thead th{background:#1d4ed8;color:#fff;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.4px;padding:13px 14px;text-align:left}
  #sheet thead th:first-child{border-radius:10px 0 0 10px}
  #sheet thead th:last-child{border-radius:0 10px 10px 0}
  #sheet tbody td{padding:15px 14px;border-bottom:1px solid #e5e7eb;vertical-align:top}
  #sheet tbody td.name{font-weight:600;color:#111827}
  #sheet .c{text-align:center}
  #sheet .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #sheet .muted{color:#6b7280}
  #sheet .sum{display:flex;justify-content:flex-end;margin-top:20px}
  #sheet .sum .box{width:400px}
  #sheet .sum .row{display:flex;justify-content:space-between;padding:8px 14px;font-size:16px;color:#374151}
  #sheet .sum .row b{font-weight:600;color:#111827;font-variant-numeric:tabular-nums}
  #sheet .sum .grand{margin-top:6px;background:#1d4ed8;color:#fff;border-radius:10px;padding:14px 16px;font-size:16px;font-weight:600;align-items:center}
  #sheet .sum .grand b{color:#fff;font-size:24px;font-weight:800}
  #sheet .words{margin-top:14px;text-align:right;font-size:15px;font-style:italic;color:#4b5563}
  #sheet .note{margin-top:28px;padding:14px 18px;border-left:4px solid #f59e0b;background:#fffbeb;border-radius:0 10px 10px 0;font-size:15px;color:#374151;white-space:pre-line;line-height:1.6}
  #sheet .note b{color:#92400e}
  #sheet .note.warr{border-left-color:#16a34a;background:#f0fdf4}
  #sheet .note.warr b{color:#166534}
  #sheet .note + .note{margin-top:10px}
  #sheet .info .line2{font-size:14px;color:#4b5563;margin-top:2px}
  #sheet .foot{margin-top:auto;padding-top:48px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
  #sheet .thanks{font-size:15px;color:#6b7280}
  #sheet .sign{text-align:center;min-width:240px;font-size:15px;color:#4b5563}
  #sheet .sign .who{margin-top:72px;font-weight:700;color:#111827}
  #sheet .empty{padding:32px 12px;text-align:center;color:#9ca3af}

  @media print{
    body{background:#fff;padding:0}
    .topbar,.editor-col,.dock,.toast,#splash{display:none!important}
    .preview-col{display:block!important}
    main{display:block;padding:0}
    .card{box-shadow:none;padding:0}
    .preview-wrap{border:0}
    #sheet{transform:none!important;width:100%;min-height:0}
    .preview-box{height:auto!important}
  }
</style>
</head>
<body data-tab="edit">

<div id="splash" aria-hidden="true">
  <div class="box">
    <svg viewBox="100 80 300 360">
      <g class="paper">
        <path d="M146 92h160l66 66v246a24 24 0 0 1-24 24H146a24 24 0 0 1-24-24V116a24 24 0 0 1 24-24z" fill="#fff"/>
        <path class="fold" d="M306 92v42a24 24 0 0 0 24 24h42z" fill="#c7d4ff"/>
        <rect class="ln ln1" x="160" y="190" width="120" height="18" rx="9" fill="#1d4ed8"/>
        <rect class="ln ln2" x="160" y="236" width="172" height="14" rx="7" fill="#d5dcef"/>
        <rect class="ln ln3" x="160" y="272" width="172" height="14" rx="7" fill="#d5dcef"/>
        <rect class="ln ln4" x="160" y="308" width="110" height="14" rx="7" fill="#d5dcef"/>
      </g>
      <g class="coin">
        <circle cx="352" cy="372" r="74" fill="#f59e0b" stroke="#1d4ed8" stroke-width="14"/>
        <text x="352" y="400" text-anchor="middle" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="92" font-weight="800" fill="#fff">₫</text>
      </g>
    </svg>
    <h2>Báo giá</h2>
    <p>Lập báo giá nhanh, gửi khách liền tay</p>
  </div>
</div>

<div class="topbar">
  <div class="in">
    <img src="icon-180.png" alt="">
    <h1>Báo giá</h1>
    <div class="tabs" role="tablist">
      <button class="on" data-tab="edit">Soạn</button>
      <button data-tab="preview">Xem</button>
      <button data-tab="history">Lịch sử</button>
    </div>
    <button class="icon-btn" id="reset" title="Báo giá mới" aria-label="Báo giá mới">＋</button>
  </div>
</div>

<main>
  <!-- ========== SOẠN ========== -->
  <div class="col editor-col">

    <section class="card">
      <input id="subtitle" placeholder="Nội dung (VD: Lắp đặt mạng Wi-Fi Mesh)" aria-label="Nội dung báo giá">
      <div class="two" style="margin-top:8px">
        <input id="customer" list="custList" placeholder="Tên khách" aria-label="Tên khách hàng" autocomplete="off">
        <input id="custPhone" inputmode="tel" placeholder="SĐT khách" aria-label="Số điện thoại khách">
      </div>
      <input id="custAddr" style="margin-top:8px" placeholder="Địa chỉ lắp đặt" aria-label="Địa chỉ khách">
      <div class="two" style="margin-top:8px">
        <input id="date" type="date" aria-label="Ngày">
        <select id="warranty" aria-label="Thời hạn bảo hành">
          <option value="">Không bảo hành</option>
          <option value="1">BH 1 tháng</option>
          <option value="3">BH 3 tháng</option>
          <option value="6">BH 6 tháng</option>
          <option value="12">BH 12 tháng</option>
          <option value="18">BH 18 tháng</option>
          <option value="24">BH 24 tháng</option>
          <option value="36">BH 36 tháng</option>
        </select>
      </div>
      <datalist id="custList"></datalist>
      <div class="savebar">
        <span class="st" id="saveState"></span>
        <button class="btn ghost sm" id="btnSave" type="button">Lưu khách</button>
      </div>
    </section>

    <section class="card">
      <div class="sec-title"><span>Hạng mục</span><span id="itemCount" style="text-transform:none;letter-spacing:0;font-weight:500"></span></div>
      <div class="items" id="items"></div>
      <button class="add" id="addItem" type="button">＋ Thêm hạng mục</button>
      <datalist id="units"><option value="cái"><option value="bộ"><option value="m"><option value="cuộn"><option value="chiếc"><option value="người"><option value="công"><option value="gói"><option value="lần"></datalist>
    </section>

    <details class="card" id="extraBox">
      <summary><span class="t">Giảm giá, VAT, ghi chú</span><span class="s" id="extraSum"></span></summary>
      <div class="body">
        <div class="two">
          <div class="field"><label for="discount">Giảm giá (đ)</label><input id="discount" inputmode="decimal" placeholder="0"></div>
          <div class="field"><label for="vat">VAT (%)</label><input id="vat" inputmode="decimal" placeholder="0"></div>
        </div>
        <div class="field" style="margin-top:10px"><label for="note">Ghi chú</label><textarea id="note" placeholder="VD: Báo giá có hiệu lực 7 ngày."></textarea></div>
      </div>
    </details>

    <details class="card" id="shopBox">
      <summary><span class="t">Cửa hàng của bạn</span><span class="s" id="shopSum"></span></summary>
      <div class="body">
        <div class="field"><label for="shopName">Tên cửa hàng / người báo giá</label><input id="shopName" placeholder="VD: Điện tử Minh Anh"></div>
        <div class="two" style="margin-top:10px">
          <div class="field"><label for="shopPhone">Số điện thoại</label><input id="shopPhone" inputmode="tel" placeholder="09xx xxx xxx"></div>
          <div class="field"><label for="shopAddr">Địa chỉ</label><input id="shopAddr" placeholder="Không bắt buộc"></div>
        </div>
      </div>
    </details>
  </div>

  <!-- ========== LỊCH SỬ ========== -->
  <div class="col history-col">
    <section class="card">
      <input id="hSearch" type="search" placeholder="Tìm tên, SĐT, địa chỉ, nội dung…" aria-label="Tìm khách">
      <div class="chips" id="hChips"></div>
    </section>
    <p class="hstat" id="hStat"></p>
    <div class="hlist" id="hList"></div>
    <section class="card">
      <div class="sec-title">Sao lưu dữ liệu</div>
      <p class="hint" style="margin:0 0 10px">Lịch sử lưu trên máy này. Nên sao lưu ra file định kỳ, khi đổi máy thì khôi phục lại.</p>
      <div class="backup">
        <button class="btn ghost sm" id="btnBackup" type="button">Sao lưu ra file</button>
        <button class="btn ghost sm" id="btnRestore" type="button">Khôi phục từ file</button>
      </div>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    </section>
  </div>

  <!-- ========== XEM TRƯỚC ========== -->
  <div class="col preview-col">
    <section class="card">
      <div class="sec-title">Ảnh gửi khách</div>
      <div class="preview-wrap"><div class="preview-box" id="previewBox"><div id="sheet"></div></div></div>
    </section>
  </div>
</main>

<div class="dock">
  <div class="in">
    <div class="total"><span>Tổng cộng</span><b id="dockTotal">0 đ</b></div>
    <button class="btn primary" id="btnShare">Gửi ảnh</button>
    <button class="btn ghost" id="btnDownload" title="Tải ảnh về máy">Ảnh</button>
    <button class="btn ghost" id="btnPdf" title="Lưu file PDF khổ A4">PDF</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'baogia-state-v3';
  const SHOP_KEY = 'baogia-shop-v1';

  // ---------- Số & tiền ----------
  const fmt = n => Math.round(n || 0).toLocaleString('vi-VN');

  // "350k" -> 350000, "1.5tr" / "1,5tr" -> 1500000, "8.200" -> 8200
  function parseMoney(v) {
    if (v == null) return 0;
    let s = String(v).trim().toLowerCase().replace(/\s|đ|vnđ|vnd/g, '');
    if (!s) return 0;
    const m = s.match(/(k|nghìn|ngàn|tr|triệu|m|tỷ|ty)$/);
    if (m) {
      const mult = { k: 1e3, 'nghìn': 1e3, 'ngàn': 1e3, tr: 1e6, 'triệu': 1e6, m: 1e6, 'tỷ': 1e9, ty: 1e9 }[m[1]];
      s = s.slice(0, -m[1].length).replace(',', '.');
      const n = parseFloat(s);
      return isNaN(n) ? 0 : Math.round(n * mult);
    }
    if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, '');
    else s = s.replace(',', '.');
    const n = parseFloat(s);
    return isNaN(n) ? 0 : Math.round(n);
  }
  function parseQty(v) {
    const n = parseFloat(String(v || '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }

  // Đọc số thành chữ tiếng Việt
  const SO = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function doc3(n, full) {
    const tr = Math.floor(n / 100), ch = Math.floor(n % 100 / 10), dv = n % 10, s = [];
    if (full || tr > 0) s.push(SO[tr] + ' trăm');
    if (ch > 1) {
      s.push(SO[ch] + ' mươi');
      if (dv === 1) s.push('mốt'); else if (dv === 4) s.push('tư');
      else if (dv === 5) s.push('lăm'); else if (dv > 0) s.push(SO[dv]);
    } else if (ch === 1) {
      s.push('mười');
      if (dv === 5) s.push('lăm'); else if (dv > 0) s.push(SO[dv]);
    } else if (dv > 0) {
      if (full || tr > 0) s.push('linh');
      s.push(SO[dv]);
    }
    return s.join(' ');
  }
  function numToWords(num) {
    num = Math.round(num);
    if (!num) return 'Không đồng';
    const neg = num < 0; num = Math.abs(num);
    const units = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ', 'triệu tỷ'];
    const groups = [];
    while (num > 0) { groups.push(num % 1000); num = Math.floor(num / 1000); }
    const parts = [];
    for (let i = groups.length - 1; i >= 0; i--) {
      if (groups[i] === 0) continue;
      parts.push(doc3(groups[i], i < groups.length - 1) + (units[i] ? ' ' + units[i] : ''));
    }
    let s = parts.join(' ') + ' đồng';
    if (neg) s = 'âm ' + s;
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const viDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };

  // ---------- Trạng thái ----------
  // Ban đầu chỉ 1 dòng trắng, người bán tự thêm
  const blank = () => ({
    id: null, savedSig: null,
    subtitle: '', customer: '', custPhone: '', custAddr: '', date: today(), warranty: '',
    items: [{ name: '', unit: '', qty: '', price: '' }],
    discount: '', vat: '', note: ''
  });
  const emptyItem = () => ({ name: '', unit: '', qty: '', price: '' });

  let state, shop;
  try { state = { ...blank(), ...(JSON.parse(localStorage.getItem(KEY)) || {}) }; } catch { state = blank(); }
  const HIST_KEY = 'baogia-history-v1';
  let history;
  try { history = JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch { history = []; }
  const saveHistory = () => { try { localStorage.setItem(HIST_KEY, JSON.stringify(history)); return true; } catch { toast('Bộ nhớ máy đầy, không lưu được'); return false; } };
  try { shop = JSON.parse(localStorage.getItem(SHOP_KEY)) || {}; } catch { shop = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(SHOP_KEY, JSON.stringify(shop)); } catch {} };

  // ---------- Tab (điện thoại) ----------
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    showTab(b.dataset.tab);
  }));

  function showTab(tab) {
    document.body.dataset.tab = tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
    window.scrollTo(0, 0);
    if (tab === 'history') renderHistory();
    fitPreview();
  }

  // ---------- Form ----------
  const simpleFields = ['subtitle', 'customer', 'custPhone', 'custAddr', 'date', 'warranty', 'discount', 'vat', 'note'];
  const shopFields = { shopName: 'name', shopPhone: 'phone', shopAddr: 'addr' };

  function fillForm() {
    simpleFields.forEach(f => $(f).value = state[f] ?? '');
    Object.entries(shopFields).forEach(([id, k]) => $(id).value = shop[k] ?? '');
    $('shopBox').open = !shop.name;              // chưa có thông tin cửa hàng thì mở sẵn
    $('extraBox').open = !!(state.discount || state.vat || state.note);
    renderItems();
  }

  const lineTotal = it => parseQty(it.qty) * parseMoney(it.price);

  function renderItems() {
    const box = $('items');
    box.innerHTML = '';
    state.items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div class="r1">
          <span class="idx">${i + 1}</span>
          <input data-k="name" placeholder="Tên hạng mục" value="${esc(it.name)}" aria-label="Tên hạng mục">
          <span class="lt"></span>
          <button class="del" type="button" title="Xoá dòng này" aria-label="Xoá">×</button>
        </div>
        <div class="r2">
          <input data-k="qty" inputmode="decimal" placeholder="SL" value="${esc(it.qty)}" aria-label="Số lượng">
          <input data-k="unit" list="units" placeholder="ĐVT" value="${esc(it.unit)}" aria-label="Đơn vị tính">
          <span class="x">×</span>
          <input data-k="price" inputmode="decimal" placeholder="Đơn giá (350k)" value="${esc(it.price)}" aria-label="Đơn giá">
        </div>`;
      const lt = el.querySelector('.lt');
      const showLt = () => { const v = lineTotal(it); lt.textContent = fmt(v) + ' đ'; lt.classList.toggle('zero', !v); };
      showLt();
      el.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          it[inp.dataset.k] = inp.value;
          showLt();
          update();
        });
      });
      el.querySelector('input[data-k="price"]').addEventListener('blur', e => {
        const v = parseMoney(e.target.value);
        if (v) { it.price = fmt(v); e.target.value = it.price; showLt(); update(); }
      });
      el.querySelector('.del').addEventListener('click', () => {
        if (state.items.length === 1) { state.items[0] = emptyItem(); }
        else {
          if ((it.name || it.price) && !confirm(`Xoá "${it.name || 'dòng ' + (i + 1)}"?`)) return;
          state.items.splice(i, 1);
        }
        renderItems(); update();
      });
      // Enter: nhảy sang ô kế tiếp; ở ô đơn giá dòng cuối thì thêm dòng mới
      const order = ['name', 'qty', 'unit', 'price'];
      el.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const k = order.indexOf(inp.dataset.k);
        if (k < order.length - 1) { el.querySelector(`input[data-k="${order[k + 1]}"]`).focus(); return; }
        inp.blur();
        const next = el.nextElementSibling;
        if (next) next.querySelector('input[data-k="name"]').focus();
        else $('addItem').click();
      }));
      el.querySelectorAll('input').forEach(inp => inp.setAttribute('enterkeyhint', inp.dataset.k === 'price' && i === state.items.length - 1 ? 'done' : 'next'));
      box.appendChild(el);
    });
  }

  simpleFields.forEach(f => $(f).addEventListener(f === 'warranty' ? 'change' : 'input', e => { state[f] = e.target.value; update(); }));
  // Chọn khách cũ từ gợi ý -> tự điền SĐT, địa chỉ
  $('customer').addEventListener('change', () => {
    const name = state.customer.trim().toLowerCase();
    const old = history.find(h => (h.customer || '').trim().toLowerCase() === name);
    if (!old) return;
    if (!state.custPhone && old.custPhone) { state.custPhone = old.custPhone; $('custPhone').value = old.custPhone; }
    if (!state.custAddr && old.custAddr) { state.custAddr = old.custAddr; $('custAddr').value = old.custAddr; }
    update();
  });
  $('discount').addEventListener('blur', e => { const v = parseMoney(e.target.value); state.discount = v ? fmt(v) : ''; e.target.value = state.discount; update(); });
  Object.entries(shopFields).forEach(([id, k]) => $(id).addEventListener('input', e => { shop[k] = e.target.value; update(); }));

  $('addItem').addEventListener('click', () => {
    state.items.push(emptyItem());
    renderItems(); update();
    const last = $('items').lastElementChild;
    last.classList.add('new');
    last.querySelector('input[data-k="name"]').focus();
  });
  $('reset').addEventListener('click', () => {
    if (isDirty() && !confirm('Báo giá đang soạn chưa lưu. Bỏ để làm báo giá mới?')) return;
    state = blank(); fillForm(); update();
    showTab('edit');
  });

  // ---------- Tính tiền ----------
  function totals() {
    const rows = state.items
      .filter(it => parseQty(it.qty) > 0 || parseMoney(it.price) > 0)  // dòng để 0 thì không đưa vào ảnh
      .map(it => ({ ...it, q: parseQty(it.qty), p: parseMoney(it.price), t: lineTotal(it) }));
    const subtotal = rows.reduce((s, r) => s + r.t, 0);
    const discount = parseMoney(state.discount);
    const vatPct = parseFloat(String(state.vat || '').replace(',', '.')) || 0;
    const afterDisc = subtotal - discount;
    const vat = Math.round(afterDisc * vatPct / 100);
    return { rows, subtotal, discount, vatPct, vat, total: afterDisc + vat };
  }

  // ---------- Phiếu ----------
  function renderSheet(t) {
    const hasShop = shop.name || shop.phone || shop.addr;
    const fromHtml = hasShop ? `
      ${shop.name ? `<div class="name">${esc(shop.name)}</div>` : ''}
      ${shop.phone ? `<div class="line">SĐT: ${esc(shop.phone)}</div>` : ''}
      ${shop.addr ? `<div class="line">${esc(shop.addr)}</div>` : ''}` : '';
    const info = [];
    if (state.customer || state.custPhone) info.push(`<div><div class="k">Kính gửi</div><div class="v">${esc(state.customer || '')}</div>${state.custPhone ? `<div class="line2">${esc(state.custPhone)}</div>` : ''}${state.custAddr ? `<div class="line2">${esc(state.custAddr)}</div>` : ''}</div>`);
    if (state.subtitle) info.push(`<div><div class="k">Nội dung</div><div class="v">${esc(state.subtitle)}</div></div>`);
    const body = t.rows.length
      ? t.rows.map((r, i) => `<tr><td class="c muted">${i + 1}</td><td class="name">${esc(r.name)}</td><td class="c">${esc(r.unit)}</td><td class="c">${r.q.toLocaleString('vi-VN')}</td><td class="r">${fmt(r.p)}</td><td class="r"><b>${fmt(r.t)}</b></td></tr>`).join('')
      : `<tr><td colspan="6" class="empty">Chưa có hạng mục nào</td></tr>`;
    let sums = '';
    if (t.discount || t.vatPct) {
      sums += `<div class="row"><span>Cộng tiền hàng</span><b>${fmt(t.subtotal)} đ</b></div>`;
      if (t.discount) sums += `<div class="row"><span>Giảm giá</span><b>-${fmt(t.discount)} đ</b></div>`;
      if (t.vatPct) sums += `<div class="row"><span>VAT (${esc(state.vat)}%)</span><b>${fmt(t.vat)} đ</b></div>`;
    }
    sums += `<div class="row grand"><span>TỔNG CỘNG</span><b>${fmt(t.total)} đ</b></div>`;

    $('sheet').innerHTML = `
      <div class="bar"></div>
      <div class="pad">
        <div class="head">
          <div class="from">${fromHtml}</div>
          <div class="doc">
            <h1>BÁO GIÁ</h1>
            <div class="meta">${state.date ? `Ngày: <b>${viDate(state.date)}</b>` : ''}</div>
          </div>
        </div>
        ${info.length ? `<div class="info${info.length === 1 ? ' one' : ''}">${info.join('')}</div>` : '<div style="height:32px"></div>'}
        <table>
          <thead><tr><th class="c" style="width:56px">STT</th><th>Hạng mục</th><th class="c" style="width:80px">ĐVT</th><th class="c" style="width:70px">SL</th><th class="r" style="width:150px">Đơn giá</th><th class="r" style="width:170px">Thành tiền</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
        <div class="sum"><div class="box">${sums}</div></div>
        <div class="words">Bằng chữ: ${numToWords(t.total)}.</div>
        ${state.warranty ? `<div class="note warr"><b>Bảo hành:</b> ${esc(state.warranty)} tháng kể từ ngày lắp đặt${state.date ? ` (đến ${viDate(warrantyEnd(state.date, state.warranty))})` : ''}</div>` : ''}
        ${state.note ? `<div class="note"><b>Ghi chú:</b> ${esc(state.note)}</div>` : ''}
        <div class="foot">
          <div class="thanks">Cảm ơn Quý khách đã quan tâm!<br>Đơn vị tính: VNĐ</div>
          <div class="sign">Người báo giá<div class="who">${esc(shop.name || '')}&nbsp;</div></div>
        </div>
      </div>`;
    fitPreview();
  }

  // Thu nhỏ phiếu cho vừa khung xem trước
  function fitPreview() {
    const box = $('previewBox'), sheet = $('sheet');
    const w = box.parentElement.clientWidth;
    if (!w) return;
    const scale = Math.min(1, w / 900);
    sheet.style.transform = `scale(${scale})`;
    box.style.height = (sheet.offsetHeight * scale) + 'px';
  }
  window.addEventListener('resize', fitPreview);

  // ---------- Cập nhật chung ----------
  let timer;
  function update() {
    const t = totals();
    renderSheet(t);
    $('dockTotal').textContent = fmt(t.total) + ' đ';
    $('itemCount').textContent = t.rows.length ? `${t.rows.length} mục · ${fmt(t.subtotal)} đ` : '';
    const ex = [];
    if (t.discount) ex.push('Giảm ' + fmt(t.discount) + ' đ');
    if (t.vatPct) ex.push('VAT ' + state.vat + '%');
    if (state.note) ex.push('Có ghi chú');
    $('extraSum').textContent = ex.join(' · ') || 'Không có';
    $('shopSum').textContent = shop.name || 'Chưa nhập';
    renderSaveState();
    clearTimeout(timer); timer = setTimeout(save, 300);
  }

  // ---------- Lịch sử khách ----------
  function warrantyEnd(dateIso, months) {
    const [y, m, d] = dateIso.split('-').map(Number);
    const end = new Date(y, m - 1 + Number(months), d);
    if (end.getDate() !== d) end.setDate(0);                  // 31/1 + 1 tháng -> 28/2
    const p = n => String(n).padStart(2, '0');
    return `${end.getFullYear()}-${p(end.getMonth() + 1)}-${p(end.getDate())}`;
  }
  const daysLeft = iso => Math.round((new Date(iso + 'T23:59:59') - new Date()) / 864e5);
  function warrantyInfo(r) {
    if (!r.warranty || !r.date) return null;
    const end = warrantyEnd(r.date, r.warranty), left = daysLeft(end);
    if (left < 0) return { cls: 'off', text: `Hết BH từ ${viDate(end)}`, key: 'expired' };
    if (left <= 30) return { cls: 'soon', text: `Sắp hết BH · còn ${left} ngày (${viDate(end)})`, key: 'soon' };
    return { cls: 'on', text: `Còn BH đến ${viDate(end)}`, key: 'active' };
  }

  const FIELDS = ['subtitle', 'customer', 'custPhone', 'custAddr', 'date', 'warranty', 'items', 'discount', 'vat', 'note'];
  const sig = () => JSON.stringify(FIELDS.map(f => state[f]));
  const hasContent = () => !!(state.customer || state.custPhone || totals().total);
  const isDirty = () => hasContent() && sig() !== state.savedSig;

  function renderSaveState() {
    const el = $('saveState');
    if (!hasContent()) { el.textContent = 'Nhập tên hoặc SĐT khách để lưu lịch sử'; el.className = 'st'; return; }
    if (!isDirty()) {
      const rec = history.find(h => h.id === state.id);
      const t = rec ? new Date(rec.savedAt) : null, p2 = n => String(n).padStart(2, '0');
      el.textContent = '✓ Đã lưu' + (t ? ` lúc ${p2(t.getHours())}:${p2(t.getMinutes())}, ${p2(t.getDate())}/${p2(t.getMonth() + 1)}` : '');
      el.className = 'st ok';
    } else { el.textContent = state.id ? 'Có thay đổi chưa lưu' : 'Chưa lưu'; el.className = 'st warn'; }
    $('btnSave').textContent = state.id ? 'Lưu thay đổi' : 'Lưu khách';
  }

  // silent = true: tự lưu khi gửi ảnh/PDF, không báo lỗi nếu thiếu tên khách
  function saveToHistory(silent = false) {
    if (!state.customer.trim() && !state.custPhone.trim()) {
      if (!silent) { toast('Nhập tên hoặc SĐT khách trước'); showTab('edit'); $('customer').focus(); }
      return false;
    }
    if (!isDirty()) { if (!silent) toast('Đã lưu rồi'); return true; }
    const rec = { id: state.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6), savedAt: new Date().toISOString(), total: totals().total };
    FIELDS.forEach(f => rec[f] = JSON.parse(JSON.stringify(state[f] ?? '')));
    const i = history.findIndex(h => h.id === rec.id);
    if (i >= 0) history[i] = rec; else history.unshift(rec);
    if (!saveHistory()) return false;
    state.id = rec.id; state.savedSig = sig();
    save(); renderSaveState(); refreshCustList();
    toast(silent ? 'Đã lưu vào lịch sử khách' : 'Đã lưu');
    return true;
  }
  $('btnSave').addEventListener('click', () => saveToHistory(false));

  function refreshCustList() {
    const names = [...new Set(history.map(h => (h.customer || '').trim()).filter(Boolean))];
    $('custList').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
  }

  let hFilter = 'all';
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
  function renderHistory() {
    const q = norm($('hSearch').value.trim());
    const counts = { all: history.length, active: 0, soon: 0, expired: 0 };
    history.forEach(h => { const w = warrantyInfo(h); if (w) { counts[w.key]++; if (w.key === 'soon') counts.active++; } });
    const chips = [['all', 'Tất cả'], ['active', 'Còn bảo hành'], ['soon', 'Sắp hết BH'], ['expired', 'Hết BH']];
    $('hChips').innerHTML = chips.map(([k, t]) => `<button class="chip${hFilter === k ? ' on' : ''}" data-f="${k}">${t}<span class="n"> ${counts[k]}</span></button>`).join('');
    $('hChips').querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { hFilter = c.dataset.f; renderHistory(); }));

    let list = history.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.savedAt.localeCompare(a.savedAt));
    if (hFilter !== 'all') list = list.filter(h => { const w = warrantyInfo(h); return w && (w.key === hFilter || (hFilter === 'active' && w.key === 'soon')); });
    if (q) list = list.filter(h => norm([h.customer, h.custPhone, h.custAddr, h.subtitle, h.note, ...(h.items || []).map(i => i.name)].join(' ')).includes(q)
                                    || String(h.custPhone || '').replace(/\D/g, '').includes(q.replace(/\D/g, '') || '#'));
    const nCust = new Set(history.map(h => norm(h.customer) + '|' + String(h.custPhone || '').replace(/\D/g, ''))).size;
    $('hStat').textContent = history.length ? `${list.length} / ${history.length} báo giá · ${nCust} khách` : '';

    if (!history.length) { $('hList').innerHTML = `<div class="hempty">Chưa có khách nào.<br>Soạn báo giá, nhập tên hoặc SĐT khách rồi bấm <b>Lưu khách</b>.<br>Gửi ảnh / PDF cũng tự lưu.</div>`; return; }
    if (!list.length) { $('hList').innerHTML = `<div class="hempty">Không tìm thấy khách phù hợp.</div>`; return; }

    $('hList').innerHTML = list.map(h => {
      const w = warrantyInfo(h);
      const items = (h.items || []).filter(i => i.name && (parseQty(i.qty) || parseMoney(i.price))).map(i => i.name);
      const tel = String(h.custPhone || '').replace(/[^\d+]/g, '');
      return `<div class="hcard" data-id="${h.id}">
        <div class="h1"><span class="cname">${esc(h.customer || h.custPhone || 'Khách')}</span><span class="amt">${fmt(h.total)} đ</span></div>
        <div class="meta">${[h.date ? viDate(h.date) : '', h.custPhone ? esc(h.custPhone) : '', esc(h.custAddr || '')].filter(Boolean).join(' · ')}</div>
        ${h.subtitle || items.length ? `<div class="what">${esc(h.subtitle || '')}${items.length ? `${h.subtitle ? '<br>' : ''}<small>${esc(items.join(', '))}</small>` : ''}</div>` : ''}
        ${w ? `<span class="badge ${w.cls}">${w.text}</span>` : ''}
        <div class="acts">
          <button data-a="open">Mở</button>
          <button data-a="copy">Báo giá lại</button>
          ${tel ? `<a href="tel:${tel}">Gọi</a>` : ''}
          <button data-a="del" class="del2" aria-label="Xoá">✕</button>
        </div></div>`;
    }).join('');
    $('hList').querySelectorAll('.hcard').forEach(card => card.querySelectorAll('button[data-a]').forEach(b => b.addEventListener('click', () => {
      const rec = history.find(h => h.id === card.dataset.id); if (!rec) return;
      if (b.dataset.a === 'del') {
        if (!confirm(`Xoá báo giá của "${rec.customer || rec.custPhone}" ngày ${viDate(rec.date)}?`)) return;
        history = history.filter(h => h.id !== rec.id); saveHistory();
        if (state.id === rec.id) { state.id = null; state.savedSig = null; }
        refreshCustList(); renderHistory(); renderSaveState(); return;
      }
      if (isDirty() && state.id !== rec.id && !confirm('Báo giá đang soạn chưa lưu. Vẫn mở báo giá khác?')) return;
      state = { ...blank(), ...JSON.parse(JSON.stringify(rec)) };
      delete state.total; delete state.savedAt;
      if (b.dataset.a === 'copy') {               // báo giá mới cho khách cũ: giữ hạng mục, ngày hôm nay
        state.id = null; state.savedSig = null; state.date = today();
      } else state.savedSig = sig();
      fillForm(); update(); showTab('edit');
      toast(b.dataset.a === 'copy' ? 'Đã tạo báo giá mới từ báo giá cũ' : 'Đã mở báo giá');
    })));
  }
  $('hSearch').addEventListener('input', renderHistory);

  // Sao lưu / khôi phục
  $('btnBackup').addEventListener('click', () => {
    if (!history.length) { toast('Chưa có dữ liệu để sao lưu'); return; }
    const data = { app: 'baogia', version: 1, exportedAt: new Date().toISOString(), shop, history };
    download(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }), `bao-gia-sao-luu-${today()}.json`);
    toast(`Đã sao lưu ${history.length} báo giá`);
  });
  $('btnRestore').addEventListener('click', () => $('restoreFile').click());
  $('restoreFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.app !== 'baogia' || !Array.isArray(data.history)) throw 0;
      let added = 0, updated = 0;
      data.history.forEach(r => {
        if (!r || !r.id) return;
        const i = history.findIndex(h => h.id === r.id);
        if (i < 0) { history.push(r); added++; }
        else if ((r.savedAt || '') > (history[i].savedAt || '')) { history[i] = r; updated++; }
      });
      if (data.shop && !shop.name) { shop = data.shop; Object.entries(shopFields).forEach(([id, k]) => $(id).value = shop[k] ?? ''); }
      saveHistory(); save(); refreshCustList(); renderHistory(); update();
      toast(`Đã khôi phục: ${added} mới, ${updated} cập nhật`);
    } catch { toast('File sao lưu không hợp lệ'); }
  });

  // ---------- Xuất ảnh ----------
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }

  async function makeCanvas(a4 = false) {
    if (!totals().total) { toast('Chưa nhập số lượng và đơn giá'); return null; }
    if (typeof html2canvas === 'undefined') { toast('Cần có mạng để tạo ảnh'); return null; }
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    // Tạm hiện phiếu ở kích thước thật để chụp (kể cả khi đang ở tab Soạn)
    const sheet = $('sheet');
    const clone = sheet.cloneNode(true);
    clone.removeAttribute('id'); clone.id = 'sheet';
    if (a4) clone.classList.add('a4');
    clone.style.cssText = 'transform:none;position:fixed;left:-10000px;top:0';
    sheet.id = 'sheet-live';
    document.body.appendChild(clone);
    try {
      return await html2canvas(clone, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    } finally { clone.remove(); sheet.id = 'sheet'; }
  }
  async function makeImage() {
    const canvas = await makeCanvas(); if (!canvas) return null;
    return await new Promise(r => canvas.toBlob(r, 'image/png'));
  }
  const fileName = (ext = 'png') => {
    const who = (state.customer || state.subtitle || '').trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');
    return `bao-gia${who ? '-' + who : ''}-${(state.date || today())}.${ext}`;
  };
  function download(blob, name = fileName()) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  $('btnDownload').addEventListener('click', async () => {
    toast('Đang tạo ảnh…');
    const blob = await makeImage(); if (!blob) return;
    download(blob); toast('Đã tải ảnh'); saveToHistory(true);
  });
  $('btnShare').addEventListener('click', async () => {
    toast('Đang tạo ảnh…');
    const blob = await makeImage(); if (!blob) return;
    saveToHistory(true);
    const file = new File([blob], fileName(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Bảng báo giá' }); } catch (e) { /* người dùng huỷ */ }
    } else { download(blob); toast('Máy không hỗ trợ chia sẻ, đã tải ảnh về'); }
  });
  // Lưu PDF khổ A4 (phiếu dài hơn 1 trang thì tự chia trang)
  $('btnPdf').addEventListener('click', async () => {
    if (!window.jspdf) { toast('Cần có mạng để tạo PDF'); return; }
    toast('Đang tạo PDF…');
    const canvas = await makeCanvas(true); if (!canvas) return;
    saveToHistory(true);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    const pageW = 210, pageH = 297;
    const pxPerPage = Math.floor(canvas.width * pageH / pageW);   // số px ảnh vừa 1 trang A4
    for (let y = 0, page = 0; y < canvas.height; y += pxPerPage, page++) {
      const h = Math.min(pxPerPage, canvas.height - y);
      if (h < 40 && page > 0) break;                               // bỏ phần thừa trắng quá nhỏ
      const part = document.createElement('canvas');
      part.width = canvas.width; part.height = h;
      const ctx = part.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, part.width, h);
      ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (page > 0) pdf.addPage();
      pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pageW, h * pageW / canvas.width);
    }
    const blob = pdf.output('blob');
    const name = fileName('pdf');
    const file = new File([blob], name, { type: 'application/pdf' });
    // Trên điện thoại: mở bảng chia sẻ để lưu vào Tệp / gửi Zalo; máy tính: tải về
    if (/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Báo giá' }); } catch (e) { /* huỷ */ }
    } else { download(blob, name); toast('Đã lưu PDF'); }
  });

  // ---------- Hiệu ứng mở app ----------
  (function splash() {
    const sp = $('splash');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let done = false;
    const hide = () => {
      if (done) return; done = true;
      sp.classList.add('out');
      document.body.classList.add('enter');
      setTimeout(() => { sp.remove(); document.body.classList.remove('enter'); }, 900);
    };
    setTimeout(hide, reduce ? 0 : 1500);
    sp.addEventListener('click', hide, { once: true });   // chạm để bỏ qua
  })();

  // ---------- Khởi động ----------
  fillForm();
  refreshCustList();
  update();
  if (document.fonts) document.fonts.ready.then(fitPreview);
})();
</script>
</body>
</html>
