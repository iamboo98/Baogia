<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo bảng báo giá</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --blue:#1d4ed8; --blue-soft:#eef2ff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --bg:#f3f4f6; --danger:#dc2626; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:96px}
  header.app{background:var(--blue);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
  header.app h1{margin:0;font-size:18px;font-weight:700}
  main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  .editor-col,.preview-col{min-width:0}
  @media(min-width:960px){main{grid-template-columns:420px minmax(0,1fr);align-items:start}.preview-col{position:sticky;top:72px}}
  .card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .card h2{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--blue)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
  textarea{resize:vertical;min-height:60px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;position:relative}
  .item .n{font-size:12px;font-weight:700;color:var(--blue)}
  .item .grid{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:6px}
  .item .grid3{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:8px}
  .item .sum{margin-top:8px;font-size:13px;color:var(--muted);text-align:right}
  .item .sum b{color:var(--ink)}
  .item .del{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--danger);font-size:13px;padding:4px 8px;cursor:pointer}
  .btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.ghost{background:var(--blue-soft);color:var(--blue)}
  .btn.full{width:100%}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .actions{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:6}
  .actions .btn{flex:1;max-width:220px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}

  /* ===== Phiếu báo giá (phần xuất ảnh) ===== */
  .preview-wrap{overflow:hidden;border:1px solid var(--line);border-radius:8px}
  #sheet{width:900px;background:#fff;color:#1f2937;padding:48px 52px 44px;font-family:'Be Vietnam Pro',system-ui,sans-serif;transform-origin:top left}
  #sheet .top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:3px solid var(--blue);padding-bottom:18px;margin-bottom:22px}
  #sheet .shop{font-size:15px;color:#374151;line-height:1.55;margin-bottom:14px}
  #sheet .shop b{font-size:18px;color:var(--ink)}
  #sheet h1{margin:0;font-size:34px;font-weight:800;letter-spacing:1px;color:var(--blue)}
  #sheet .sub{font-size:15px;color:var(--muted);margin-top:6px}
  #sheet .meta{font-size:15px;color:#374151;text-align:right;line-height:1.6;white-space:nowrap}
  #sheet .cust{font-size:16px;margin:0 0 18px;line-height:1.6}
  #sheet table{width:100%;border-collapse:collapse;font-size:17px}
  #sheet th{background:var(--blue);color:#fff;font-weight:600;padding:14px 12px;text-align:left}
  #sheet td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  #sheet tbody tr:nth-child(even) td{background:#f5f7fb}
  #sheet .c{text-align:center}
  #sheet .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #sheet tfoot td{border-bottom:none;padding:10px 12px}
  #sheet tfoot tr.sub td{color:#374151;font-weight:600}
  #sheet tfoot tr.first td{border-top:2px solid var(--blue);padding-top:16px}
  #sheet tfoot tr.total td{font-weight:800;font-size:20px;color:var(--blue);padding-top:14px}
  #sheet .words{margin-top:14px;font-size:15px;font-style:italic;color:#374151}
  #sheet .note{margin-top:18px;font-size:14px;color:#374151;white-space:pre-line;line-height:1.6}
  #sheet .thanks{margin-top:26px;font-size:14px;color:var(--muted)}
  @media print{
    body{background:#fff;padding:0}
    header.app,.editor-col,.actions,.toast,.preview-title{display:none!important}
    main{display:block;padding:0}
    .card{box-shadow:none;padding:0}
    #sheet{transform:none!important;width:100%;padding:0}
    .preview-box{height:auto!important}
  }
</style>
</head>
<body>
<header class="app"><h1>📄 Tạo bảng báo giá</h1></header>

<main>
  <div class="editor-col">
    <section class="card">
      <h2>Thông tin cửa hàng <span style="font-weight:400;color:var(--muted);font-size:12px">(tự lưu cho lần sau)</span></h2>
      <label>Tên cửa hàng / người báo giá</label>
      <input id="shopName" placeholder="VD: Điện tử Minh Anh">
      <div class="row2">
        <div><label>Số điện thoại</label><input id="shopPhone" inputmode="tel" placeholder="09xx xxx xxx"></div>
        <div><label>Địa chỉ</label><input id="shopAddr" placeholder="Không bắt buộc"></div>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Thông tin báo giá</h2>
      <label>Tiêu đề phụ</label>
      <input id="subtitle" placeholder="VD: Lắp đặt mạng Wi-Fi Mesh">
      <div class="row2">
        <div><label>Khách hàng</label><input id="customer" placeholder="Không bắt buộc"></div>
        <div><label>Ngày</label><input id="date" type="date"></div>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Hạng mục</h2>
      <div id="items"></div>
      <button class="btn ghost full" id="addItem">+ Thêm hạng mục</button>
      <p class="hint">Đơn giá gõ nhanh được: <b>350k</b> = 350.000, <b>1.5tr</b> = 1.500.000</p>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Tuỳ chọn thêm</h2>
      <div class="row2">
        <div><label>Giảm giá (đ)</label><input id="discount" inputmode="decimal" placeholder="0"></div>
        <div><label>VAT (%)</label><input id="vat" inputmode="decimal" placeholder="0"></div>
      </div>
      <label>Ghi chú</label>
      <textarea id="note" placeholder="VD: Bảo hành 12 tháng. Báo giá có hiệu lực 7 ngày."></textarea>
      <button class="btn ghost full" id="reset" style="margin-top:12px">Làm báo giá mới</button>
    </section>
  </div>

  <div class="preview-col">
    <section class="card">
      <h2 class="preview-title">Xem trước</h2>
      <div class="preview-wrap"><div class="preview-box" id="previewBox"><div id="sheet"></div></div></div>
    </section>
  </div>
</main>

<div class="actions">
  <button class="btn primary" id="btnShare">Gửi ảnh</button>
  <button class="btn ghost" id="btnDownload">Tải ảnh</button>
  <button class="btn ghost" id="btnPrint">In / PDF</button>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'baogia-state-v1';
  const SHOP_KEY = 'baogia-shop-v1';

  // ---------- Số & tiền ----------
  const fmt = n => Math.round(n || 0).toLocaleString('vi-VN');

  // "350k" -> 350000, "1.5tr" / "1,5tr" -> 1500000, "8.200" -> 8200
  function parseMoney(v) {
    if (v == null) return 0;
    let s = String(v).trim().toLowerCase().replace(/\s|đ|vnđ|vnd/g, '');
    if (!s) return 0;
    let mult = 1;
    const m = s.match(/(k|nghìn|ngàn|tr|triệu|m|tỷ|ty)$/);
    if (m) {
      mult = { k: 1e3, 'nghìn': 1e3, 'ngàn': 1e3, tr: 1e6, 'triệu': 1e6, m: 1e6, 'tỷ': 1e9, ty: 1e9 }[m[1]];
      s = s.slice(0, -m[1].length).replace(',', '.');
      const n = parseFloat(s);
      return isNaN(n) ? 0 : Math.round(n * mult);
    }
    // không có hậu tố: dấu . và , là phân cách hàng nghìn
    if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, '');
    else s = s.replace(',', '.');
    const n = parseFloat(s);
    return isNaN(n) ? 0 : Math.round(n);
  }
  function parseQty(v) {
    const n = parseFloat(String(v || '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }

  // Đọc số thành chữ tiếng Việt
  const SO = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function doc3(n, full) {
    const tr = Math.floor(n / 100), ch = Math.floor(n % 100 / 10), dv = n % 10, s = [];
    if (full || tr > 0) s.push(SO[tr] + ' trăm');
    if (ch > 1) {
      s.push(SO[ch] + ' mươi');
      if (dv === 1) s.push('mốt'); else if (dv === 4) s.push('tư');
      else if (dv === 5) s.push('lăm'); else if (dv > 0) s.push(SO[dv]);
    } else if (ch === 1) {
      s.push('mười');
      if (dv === 5) s.push('lăm'); else if (dv > 0) s.push(SO[dv]);
    } else if (dv > 0) {
      if (full || tr > 0) s.push('linh');
      s.push(SO[dv]);
    }
    return s.join(' ');
  }
  function numToWords(num) {
    num = Math.round(num);
    if (!num) return 'Không đồng';
    const neg = num < 0; num = Math.abs(num);
    const units = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ', 'triệu tỷ'];
    const groups = [];
    while (num > 0) { groups.push(num % 1000); num = Math.floor(num / 1000); }
    const parts = [];
    for (let i = groups.length - 1; i >= 0; i--) {
      if (groups[i] === 0) continue;
      const full = i < groups.length - 1;
      parts.push(doc3(groups[i], full) + (units[i] ? ' ' + units[i] : ''));
    }
    let s = parts.join(' ') + ' đồng';
    if (neg) s = 'âm ' + s;
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const viDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };

  // ---------- Trạng thái ----------
  const sample = () => ({
    subtitle: 'Lắp đặt mạng Wi-Fi Mesh', customer: '', date: today(),
    items: [
      { name: 'Dây LAN', unit: 'm', qty: '29', price: '8.200' },
      { name: 'Bộ mesh', unit: 'bộ', qty: '3', price: '320.000' },
      { name: 'Nhân công', unit: 'người', qty: '2', price: '300.000' },
    ],
    discount: '', vat: '', note: ''
  });
  const blank = () => ({ subtitle: '', customer: '', date: today(), items: [{ name: '', unit: '', qty: '1', price: '' }], discount: '', vat: '', note: '' });

  let state, shop;
  try { state = JSON.parse(localStorage.getItem(KEY)) || sample(); } catch { state = sample(); }
  try { shop = JSON.parse(localStorage.getItem(SHOP_KEY)) || {}; } catch { shop = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(SHOP_KEY, JSON.stringify(shop)); } catch {} };

  // ---------- Form ----------
  const simpleFields = ['subtitle', 'customer', 'date', 'discount', 'vat', 'note'];
  const shopFields = { shopName: 'name', shopPhone: 'phone', shopAddr: 'addr' };

  function fillForm() {
    simpleFields.forEach(f => $(f).value = state[f] ?? '');
    Object.entries(shopFields).forEach(([id, k]) => $(id).value = shop[k] ?? '');
    renderItems();
  }

  function renderItems() {
    const box = $('items');
    box.innerHTML = '';
    state.items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <span class="n">#${i + 1}</span>
        ${state.items.length > 1 ? '<button class="del" type="button">Xoá</button>' : ''}
        <div class="grid">
          <input data-k="name" placeholder="Tên hạng mục" value="${esc(it.name)}">
          <input data-k="unit" placeholder="ĐVT" value="${esc(it.unit)}">
        </div>
        <div class="grid3">
          <input data-k="qty" inputmode="decimal" placeholder="Số lượng" value="${esc(it.qty)}">
          <input data-k="price" inputmode="decimal" placeholder="Đơn giá" value="${esc(it.price)}">
        </div>
        <div class="sum">Thành tiền: <b>${fmt(parseQty(it.qty) * parseMoney(it.price))}</b> đ</div>`;
      el.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          it[inp.dataset.k] = inp.value;
          el.querySelector('.sum b').textContent = fmt(parseQty(it.qty) * parseMoney(it.price));
          update();
        });
      });
      el.querySelector('input[data-k="price"]').addEventListener('blur', e => {
        const v = parseMoney(e.target.value);
        if (v) { it.price = fmt(v); e.target.value = it.price; update(); }
      });
      const del = el.querySelector('.del');
      if (del) del.addEventListener('click', () => { state.items.splice(i, 1); renderItems(); update(); });
      box.appendChild(el);
    });
  }

  simpleFields.forEach(f => $(f).addEventListener('input', e => { state[f] = e.target.value; update(); }));
  $('discount').addEventListener('blur', e => { const v = parseMoney(e.target.value); state.discount = v ? fmt(v) : ''; e.target.value = state.discount; update(); });
  Object.entries(shopFields).forEach(([id, k]) => $(id).addEventListener('input', e => { shop[k] = e.target.value; update(); }));

  $('addItem').addEventListener('click', () => {
    state.items.push({ name: '', unit: '', qty: '1', price: '' });
    renderItems(); update();
    const inputs = $('items').querySelectorAll('input[data-k="name"]');
    inputs[inputs.length - 1].focus();
  });
  $('reset').addEventListener('click', () => {
    if (!confirm('Xoá nội dung hiện tại để làm báo giá mới? (Thông tin cửa hàng vẫn giữ)')) return;
    state = blank(); fillForm(); update();
  });

  // ---------- Phiếu ----------
  function totals() {
    const rows = state.items
      .filter(it => it.name.trim() || parseMoney(it.price))
      .map(it => ({ ...it, q: parseQty(it.qty), p: parseMoney(it.price), t: parseQty(it.qty) * parseMoney(it.price) }));
    const subtotal = rows.reduce((s, r) => s + r.t, 0);
    const discount = parseMoney(state.discount);
    const vatPct = parseFloat(String(state.vat || '').replace(',', '.')) || 0;
    const afterDisc = subtotal - discount;
    const vat = Math.round(afterDisc * vatPct / 100);
    return { rows, subtotal, discount, vatPct, vat, total: afterDisc + vat };
  }

  function renderSheet() {
    const t = totals();
    const hasExtra = t.discount || t.vatPct;
    const shopHtml = (shop.name || shop.phone || shop.addr) ? `
      <div class="shop">
        ${shop.name ? `<b>${esc(shop.name)}</b><br>` : ''}
        ${[shop.phone ? 'SĐT: ' + esc(shop.phone) : '', esc(shop.addr || '')].filter(Boolean).join(' · ')}
      </div>` : '';
    let foot = '';
    if (hasExtra) {
      foot += `<tr class="sub first"><td></td><td colspan="4">Cộng tiền hàng</td><td class="r">${fmt(t.subtotal)}</td></tr>`;
      if (t.discount) foot += `<tr class="sub"><td></td><td colspan="4">Giảm giá</td><td class="r">-${fmt(t.discount)}</td></tr>`;
      if (t.vatPct) foot += `<tr class="sub"><td></td><td colspan="4">VAT (${esc(state.vat)}%)</td><td class="r">${fmt(t.vat)}</td></tr>`;
      foot += `<tr class="total"><td></td><td colspan="4">TỔNG CỘNG</td><td class="r">${fmt(t.total)}</td></tr>`;
    } else {
      foot = `<tr class="total first"><td></td><td colspan="4">TỔNG CỘNG</td><td class="r">${fmt(t.total)}</td></tr>`;
    }
    $('sheet').innerHTML = `
      ${shopHtml}
      <div class="top">
        <div><h1>BẢNG BÁO GIÁ</h1>${state.subtitle ? `<div class="sub">${esc(state.subtitle)}</div>` : ''}</div>
        <div class="meta">${state.date ? 'Ngày: ' + viDate(state.date) : ''}</div>
      </div>
      ${state.customer ? `<div class="cust">Kính gửi: <b>${esc(state.customer)}</b></div>` : ''}
      <table>
        <thead><tr><th class="c">STT</th><th>Hạng mục</th><th class="c">ĐVT</th><th class="c">SL</th><th class="r">Đơn giá (VNĐ)</th><th class="r">Thành tiền (VNĐ)</th></tr></thead>
        <tbody>
          ${t.rows.map((r, i) => `<tr><td class="c">${i + 1}</td><td>${esc(r.name)}</td><td class="c">${esc(r.unit)}</td><td class="c">${r.q.toLocaleString('vi-VN')}</td><td class="r">${fmt(r.p)}</td><td class="r">${fmt(r.t)}</td></tr>`).join('')}
        </tbody>
        <tfoot>${foot}</tfoot>
      </table>
      <div class="words">Bằng chữ: ${numToWords(t.total)}.</div>
      ${state.note ? `<div class="note"><b>Ghi chú:</b> ${esc(state.note)}</div>` : ''}
      <div class="thanks">Cảm ơn Quý khách đã quan tâm!</div>`;
    fitPreview();
  }

  // Thu nhỏ phiếu cho vừa khung xem trước
  function fitPreview() {
    const box = $('previewBox'), sheet = $('sheet');
    const w = box.parentElement.clientWidth;
    const scale = Math.min(1, w / 900);
    sheet.style.transform = `scale(${scale})`;
    box.style.height = (sheet.offsetHeight * scale) + 'px';
  }
  window.addEventListener('resize', fitPreview);

  let timer;
  function update() { renderSheet(); clearTimeout(timer); timer = setTimeout(save, 300); }

  // ---------- Xuất ảnh ----------
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

  async function makeImage() {
    if (typeof html2canvas === 'undefined') { toast('Cần có mạng để tạo ảnh'); return null; }
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const sheet = $('sheet');
    const old = sheet.style.transform;
    sheet.style.transform = 'none';
    try {
      const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      return await new Promise(r => canvas.toBlob(r, 'image/png'));
    } finally { sheet.style.transform = old; }
  }
  const fileName = () => {
    const who = (state.customer || state.subtitle || '').trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');
    return `bao-gia${who ? '-' + who : ''}-${(state.date || today())}.png`;
  };
  function download(blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  $('btnDownload').addEventListener('click', async () => {
    toast('Đang tạo ảnh…');
    const blob = await makeImage(); if (!blob) return;
    download(blob); toast('Đã tải ảnh');
  });
  $('btnShare').addEventListener('click', async () => {
    toast('Đang tạo ảnh…');
    const blob = await makeImage(); if (!blob) return;
    const file = new File([blob], fileName(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Bảng báo giá' }); } catch (e) { /* người dùng huỷ */ }
    } else { download(blob); toast('Máy không hỗ trợ chia sẻ, đã tải ảnh về'); }
  });
  $('btnPrint').addEventListener('click', () => window.print());

  // ---------- Khởi động ----------
  fillForm();
  renderSheet();
  if (document.fonts) document.fonts.ready.then(fitPreview);
})();
</script>
</body>
</html>
