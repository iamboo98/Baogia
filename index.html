<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo bảng báo giá</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Báo giá">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --blue:#1d4ed8; --blue-soft:#eef2ff; --ink:#111827; --text:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --bg:#f3f4f6; --danger:#dc2626; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;padding-bottom:calc(132px + env(safe-area-inset-bottom))}
  button{font:inherit;cursor:pointer}

  /* ---------- Thanh trên ---------- */
  .topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
  .topbar .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .topbar img{width:30px;height:30px;border-radius:8px}
  .topbar h1{margin:0;font-size:17px;font-weight:700;color:var(--ink);flex:1}
  .icon-btn{border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:8px 10px;border-radius:8px}
  .icon-btn:hover{background:var(--bg)}
  .tabs{display:flex;gap:4px;margin:0 16px 10px;padding:4px;background:var(--bg);border-radius:10px}
  .tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* ---------- Bố cục ---------- */
  main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  .col{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start}
  @media(max-width:959px){ body[data-tab="edit"] .preview-col, body[data-tab="preview"] .editor-col{display:none} }
  @media(min-width:960px){
    .tabs{display:none}
    main{grid-template-columns:440px minmax(0,1fr);align-items:start}
    .preview-col{position:sticky;top:70px}
  }

  .card{background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .sec-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

  /* Ô nhập */
  .field{position:relative}
  .field + .field{margin-top:10px}
  .field label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
  input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--ink);min-width:0}
  input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
  textarea{resize:vertical;min-height:64px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two .field + .field{margin-top:0}

  /* Phần gấp gọn */
  details.card{padding:0}
  details summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}
  details summary::-webkit-details-marker{display:none}
  details summary .t{font-weight:600;color:var(--ink)}
  details summary .s{flex:1;font-size:13px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  details summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 4px;transition:transform .15s}
  details[open] summary::after{transform:rotate(225deg);margin-top:4px}
  details .body{padding:0 16px 16px}

  /* Hạng mục */
  .items{display:grid;gap:8px}
  .item{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
  .item .r1{display:grid;grid-template-columns:22px minmax(0,1fr) 30px;align-items:center;gap:8px}
  .item .idx{width:22px;height:22px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:700;display:grid;place-items:center}
  .item .del{border:0;background:none;color:#9ca3af;font-size:20px;line-height:1;width:30px;height:30px;border-radius:8px}
  .item .del:hover{background:#fef2f2;color:var(--danger)}
  .item .r2{display:grid;grid-template-columns:64px 84px 14px minmax(0,1fr);align-items:center;gap:6px;padding-left:30px}
  .item .x{text-align:center;color:var(--muted)}
  .item .r3{padding-left:30px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
  .item .r3 b{color:var(--ink);font-variant-numeric:tabular-nums}
  .item input{padding:8px 10px}
  .item input[data-k="name"]{font-weight:600}
  .add{width:100%;margin-top:10px;border:1.5px dashed #c7d2fe;background:var(--blue-soft);color:var(--blue);font-weight:600;padding:11px;border-radius:12px}
  .hint{font-size:12px;color:var(--muted);margin:8px 2px 0}

  /* Thanh dưới */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .dock .in{max-width:640px;margin:0 auto}
  .dock .total{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .dock .total span{font-size:13px;color:var(--muted)}
  .dock .total b{font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums}
  .dock .btns{display:grid;grid-template-columns:1fr auto auto;gap:8px}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.ghost{background:var(--blue-soft);color:var(--blue)}

  .toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
  .toast.show{opacity:1}

  /* ===== Phiếu báo giá (phần xuất ảnh) ===== */
  .preview-wrap{overflow:hidden;border-radius:10px;border:1px solid var(--line)}
  #sheet{width:900px;background:#fff;color:#1f2937;padding:48px 52px 44px;font-family:'Be Vietnam Pro',system-ui,sans-serif;transform-origin:top left}
  #sheet .shop{font-size:15px;color:#374151;line-height:1.55;margin-bottom:14px}
  #sheet .shop b{font-size:18px;color:var(--ink)}
  #sheet .top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:3px solid var(--blue);padding-bottom:18px;margin-bottom:22px}
  #sheet h1{margin:0;font-size:34px;font-weight:800;letter-spacing:1px;color:var(--blue)}
  #sheet .sub{font-size:15px;color:var(--muted);margin-top:6px}
  #sheet .meta{font-size:15px;color:#374151;text-align:right;line-height:1.6;white-space:nowrap}
  #sheet .cust{font-size:16px;margin:0 0 18px;line-height:1.6}
  #sheet table{width:100%;border-collapse:collapse;font-size:17px}
  #sheet th{background:var(--blue);color:#fff;font-weight:600;padding:14px 12px;text-align:left}
  #sheet td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  #sheet tbody tr:nth-child(even) td{background:#f5f7fb}
  #sheet .c{text-align:center}
  #sheet .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #sheet tfoot td{border-bottom:none;padding:10px 12px}
  #sheet tfoot tr.sub td{color:#374151;font-weight:600}
  #sheet tfoot tr.first td{border-top:2px solid var(--blue);padding-top:16px}
  #sheet tfoot tr.total td{font-weight:800;font-size:20px;color:var(--blue);padding-top:14px}
  #sheet .words{margin-top:14px;font-size:15px;font-style:italic;color:#374151}
  #sheet .note{margin-top:18px;font-size:14px;color:#374151;white-space:pre-line;line-height:1.6}
  #sheet .thanks{margin-top:26px;font-size:14px;color:var(--muted)}
  #sheet .empty{padding:28px 12px;text-align:center;color:var(--muted)}

  @media print{
    body{background:#fff;padding:0}
    .topbar,.editor-col,.dock,.toast{display:none!important}
    .preview-col{display:block!important}
    main{display:block;padding:0}
    .card{box-shadow:none;padding:0}
    .preview-wrap{border:0}
    #sheet{transform:none!important;width:100%;padding:0}
    .preview-box{height:auto!important}
  }
</style>
</head>
<body data-tab="edit">

<div class="topbar">
  <div class="in">
    <img src="icon-180.png" alt="">
    <h1>Báo giá</h1>
    <button class="icon-btn" id="reset" title="Xoá hết để làm báo giá mới">＋ Báo giá mới</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="on" data-tab="edit">Soạn</button>
    <button data-tab="preview">Xem trước</button>
  </div>
</div>

<main>
  <!-- ========== SOẠN ========== -->
  <div class="col editor-col">

    <section class="card">
      <div class="sec-title">Thông tin</div>
      <div class="field"><label for="subtitle">Nội dung báo giá</label><input id="subtitle" placeholder="VD: Lắp đặt mạng Wi-Fi Mesh"></div>
      <div class="two" style="margin-top:10px">
        <div class="field"><label for="customer">Khách hàng</label><input id="customer" placeholder="Không bắt buộc"></div>
        <div class="field"><label for="date">Ngày</label><input id="date" type="date"></div>
      </div>
    </section>

    <section class="card">
      <div class="sec-title"><span>Hạng mục</span><span id="itemCount" style="text-transform:none;letter-spacing:0;font-weight:500"></span></div>
      <div class="items" id="items"></div>
      <button class="add" id="addItem" type="button">＋ Thêm hạng mục</button>
      <p class="hint">Gõ giá nhanh: <b>350k</b> → 350.000 · <b>1.5tr</b> → 1.500.000</p>
      <datalist id="units"><option value="cái"><option value="bộ"><option value="m"><option value="cuộn"><option value="chiếc"><option value="người"><option value="công"><option value="gói"><option value="lần"></datalist>
    </section>

    <details class="card" id="extraBox">
      <summary><span class="t">Giảm giá, VAT, ghi chú</span><span class="s" id="extraSum"></span></summary>
      <div class="body">
        <div class="two">
          <div class="field"><label for="discount">Giảm giá (đ)</label><input id="discount" inputmode="decimal" placeholder="0"></div>
          <div class="field"><label for="vat">VAT (%)</label><input id="vat" inputmode="decimal" placeholder="0"></div>
        </div>
        <div class="field" style="margin-top:10px"><label for="note">Ghi chú</label><textarea id="note" placeholder="VD: Bảo hành 12 tháng. Báo giá có hiệu lực 7 ngày."></textarea></div>
      </div>
    </details>

    <details class="card" id="shopBox">
      <summary><span class="t">Cửa hàng của bạn</span><span class="s" id="shopSum"></span></summary>
      <div class="body">
        <div class="field"><label for="shopName">Tên cửa hàng / người báo giá</label><input id="shopName" placeholder="VD: Điện tử Minh Anh"></div>
        <div class="two" style="margin-top:10px">
          <div class="field"><label for="shopPhone">Số điện thoại</label><input id="shopPhone" inputmode="tel" placeholder="09xx xxx xxx"></div>
          <div class="field"><label for="shopAddr">Địa chỉ</label><input id="shopAddr" placeholder="Không bắt buộc"></div>
        </div>
        <p class="hint">Lưu trên máy này, lần sau không cần nhập lại.</p>
      </div>
    </details>
  </div>

  <!-- ========== XEM TRƯỚC ========== -->
  <div class="col preview-col">
    <section class="card">
      <div class="sec-title">Ảnh gửi khách</div>
      <div class="preview-wrap"><div class="preview-box" id="previewBox"><div id="sheet"></div></div></div>
    </section>
  </div>
</main>

<div class="dock">
  <div class="in">
    <div class="total"><span>Tổng cộng</span><b id="dockTotal">0 đ</b></div>
    <div class="btns">
      <button class="btn primary" id="btnShare">Gửi ảnh cho khách</button>
      <button class="btn ghost" id="btnDownload" title="Tải ảnh về máy">Tải ảnh</button>
      <button class="btn ghost" id="btnPrint" title="In hoặc lưu PDF">In</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'baogia-state-v2';
  const SHOP_KEY = 'baogia-shop-v1';

  // ---------- Số & tiền ----------
  const fmt = n => Math.round(n || 0).toLocaleString('vi-VN');

  // "350k" -> 350000, "1.5tr" / "1,5tr" -> 1500000, "8.200" -> 8200
  function parseMoney(v) {
    if (v == null) return 0;
    let s = String(v).trim().toLowerCase().replace(/\s|đ|vnđ|vnd/g, '');
    if (!s) return 0;
    const m = s.match(/(k|nghìn|ngàn|tr|triệu|m|tỷ|ty)$/);
    if (m) {
      const mult = { k: 1e3, 'nghìn': 1e3, 'ngàn': 1e3, tr: 1e6, 'triệu': 1e6, m: 1e6, 'tỷ': 1e9, ty: 1e9 }[m[1]];
      s = s.slice(0, -m[1].length).replace(',', '.');
      const n = parseFloat(s);
      return isNaN(n) ? 0 : Math.round(n * mult);
    }
    if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, '');
    else s = s.replace(',', '.');
    const n = parseFloat(s);
    return isNaN(n) ? 0 : Math.round(n);
  }
  function parseQty(v) {
    const n = parseFloat(String(v || '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }

  // Đọc số thành chữ tiếng Việt
  const SO = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function doc3(n, full) {
    const tr = Math.floor(n / 100), ch = Math.floor(n % 100 / 10), dv = n % 10, s = [];
    if (full || tr > 0) s.push(SO[tr] + ' trăm');
    if (ch > 1) {
      s.push(SO[ch] + ' mươi');
      if (dv === 1) s.push('mốt'); else if (dv === 4) s.push('tư');
      else if (dv === 5) s.push('lăm'); else if (dv > 0) s.push(SO[dv]);
    } else if (ch === 1) {
      s.push('mười');
      if (dv === 5) s.push('lăm'); else if (dv > 0) s.push(SO[dv]);
    } else if (dv > 0) {
      if (full || tr > 0) s.push('linh');
      s.push(SO[dv]);
    }
    return s.join(' ');
  }
  function numToWords(num) {
    num = Math.round(num);
    if (!num) return 'Không đồng';
    const neg = num < 0; num = Math.abs(num);
    const units = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ', 'triệu tỷ'];
    const groups = [];
    while (num > 0) { groups.push(num % 1000); num = Math.floor(num / 1000); }
    const parts = [];
    for (let i = groups.length - 1; i >= 0; i--) {
      if (groups[i] === 0) continue;
      parts.push(doc3(groups[i], i < groups.length - 1) + (units[i] ? ' ' + units[i] : ''));
    }
    let s = parts.join(' ') + ' đồng';
    if (neg) s = 'âm ' + s;
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const viDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };

  // ---------- Trạng thái ----------
  // Mẫu ban đầu: giữ tên hạng mục, số lượng và đơn giá để 0
  const blank = () => ({
    subtitle: '', customer: '', date: today(),
    items: [
      { name: 'Dây LAN', unit: 'm', qty: '', price: '' },
      { name: 'Bộ mesh', unit: 'bộ', qty: '', price: '' },
      { name: 'Nhân công', unit: 'người', qty: '', price: '' },
    ],
    discount: '', vat: '', note: ''
  });
  const emptyItem = () => ({ name: '', unit: '', qty: '', price: '' });

  let state, shop;
  try { state = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch { state = blank(); }
  try { shop = JSON.parse(localStorage.getItem(SHOP_KEY)) || {}; } catch { shop = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(SHOP_KEY, JSON.stringify(shop)); } catch {} };

  // ---------- Tab (điện thoại) ----------
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.body.dataset.tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    window.scrollTo(0, 0);
    fitPreview();
  }));

  // ---------- Form ----------
  const simpleFields = ['subtitle', 'customer', 'date', 'discount', 'vat', 'note'];
  const shopFields = { shopName: 'name', shopPhone: 'phone', shopAddr: 'addr' };

  function fillForm() {
    simpleFields.forEach(f => $(f).value = state[f] ?? '');
    Object.entries(shopFields).forEach(([id, k]) => $(id).value = shop[k] ?? '');
    $('shopBox').open = !shop.name;              // chưa có thông tin cửa hàng thì mở sẵn
    $('extraBox').open = !!(state.discount || state.vat || state.note);
    renderItems();
  }

  const lineTotal = it => parseQty(it.qty) * parseMoney(it.price);

  function renderItems() {
    const box = $('items');
    box.innerHTML = '';
    state.items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `
        <div class="r1">
          <span class="idx">${i + 1}</span>
          <input data-k="name" placeholder="Tên hạng mục" value="${esc(it.name)}" aria-label="Tên hạng mục">
          <button class="del" type="button" title="Xoá dòng này" aria-label="Xoá">×</button>
        </div>
        <div class="r2">
          <input data-k="qty" inputmode="decimal" placeholder="0" value="${esc(it.qty)}" aria-label="Số lượng">
          <input data-k="unit" list="units" placeholder="ĐVT" value="${esc(it.unit)}" aria-label="Đơn vị tính">
          <span class="x">×</span>
          <input data-k="price" inputmode="decimal" placeholder="Đơn giá: 0" value="${esc(it.price)}" aria-label="Đơn giá">
        </div>
        <div class="r3"><span>Thành tiền</span><b>${fmt(lineTotal(it))} đ</b></div>`;
      el.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          it[inp.dataset.k] = inp.value;
          el.querySelector('.r3 b').textContent = fmt(lineTotal(it)) + ' đ';
          update();
        });
      });
      el.querySelector('input[data-k="price"]').addEventListener('blur', e => {
        const v = parseMoney(e.target.value);
        if (v) { it.price = fmt(v); e.target.value = it.price; update(); }
      });
      el.querySelector('.del').addEventListener('click', () => {
        if (state.items.length === 1) { state.items[0] = emptyItem(); }
        else {
          if ((it.name || it.price) && !confirm(`Xoá "${it.name || 'dòng ' + (i + 1)}"?`)) return;
          state.items.splice(i, 1);
        }
        renderItems(); update();
      });
      box.appendChild(el);
    });
  }

  simpleFields.forEach(f => $(f).addEventListener('input', e => { state[f] = e.target.value; update(); }));
  $('discount').addEventListener('blur', e => { const v = parseMoney(e.target.value); state.discount = v ? fmt(v) : ''; e.target.value = state.discount; update(); });
  Object.entries(shopFields).forEach(([id, k]) => $(id).addEventListener('input', e => { shop[k] = e.target.value; update(); }));

  $('addItem').addEventListener('click', () => {
    state.items.push(emptyItem());
    renderItems(); update();
    const inputs = $('items').querySelectorAll('input[data-k="name"]');
    inputs[inputs.length - 1].focus();
  });
  $('reset').addEventListener('click', () => {
    if (!confirm('Xoá nội dung hiện tại để làm báo giá mới?\n(Thông tin cửa hàng vẫn được giữ.)')) return;
    state = blank(); fillForm(); update();
    document.querySelector('.tabs button[data-tab="edit"]').click();
  });

  // ---------- Tính tiền ----------
  function totals() {
    const rows = state.items
      .filter(it => parseQty(it.qty) > 0 || parseMoney(it.price) > 0)  // dòng để 0 thì không đưa vào ảnh
      .map(it => ({ ...it, q: parseQty(it.qty), p: parseMoney(it.price), t: lineTotal(it) }));
    const subtotal = rows.reduce((s, r) => s + r.t, 0);
    const discount = parseMoney(state.discount);
    const vatPct = parseFloat(String(state.vat || '').replace(',', '.')) || 0;
    const afterDisc = subtotal - discount;
    const vat = Math.round(afterDisc * vatPct / 100);
    return { rows, subtotal, discount, vatPct, vat, total: afterDisc + vat };
  }

  // ---------- Phiếu ----------
  function renderSheet(t) {
    const hasExtra = t.discount || t.vatPct;
    const shopHtml = (shop.name || shop.phone || shop.addr) ? `
      <div class="shop">
        ${shop.name ? `<b>${esc(shop.name)}</b><br>` : ''}
        ${[shop.phone ? 'SĐT: ' + esc(shop.phone) : '', esc(shop.addr || '')].filter(Boolean).join(' · ')}
      </div>` : '';
    let foot = '';
    if (hasExtra) {
      foot += `<tr class="sub first"><td></td><td colspan="4">Cộng tiền hàng</td><td class="r">${fmt(t.subtotal)}</td></tr>`;
      if (t.discount) foot += `<tr class="sub"><td></td><td colspan="4">Giảm giá</td><td class="r">-${fmt(t.discount)}</td></tr>`;
      if (t.vatPct) foot += `<tr class="sub"><td></td><td colspan="4">VAT (${esc(state.vat)}%)</td><td class="r">${fmt(t.vat)}</td></tr>`;
      foot += `<tr class="total"><td></td><td colspan="4">TỔNG CỘNG</td><td class="r">${fmt(t.total)}</td></tr>`;
    } else {
      foot = `<tr class="total first"><td></td><td colspan="4">TỔNG CỘNG</td><td class="r">${fmt(t.total)}</td></tr>`;
    }
    const body = t.rows.length
      ? t.rows.map((r, i) => `<tr><td class="c">${i + 1}</td><td>${esc(r.name)}</td><td class="c">${esc(r.unit)}</td><td class="c">${r.q.toLocaleString('vi-VN')}</td><td class="r">${fmt(r.p)}</td><td class="r">${fmt(r.t)}</td></tr>`).join('')
      : `<tr><td colspan="6" class="empty">Chưa có hạng mục nào</td></tr>`;
    $('sheet').innerHTML = `
      ${shopHtml}
      <div class="top">
        <div><h1>BẢNG BÁO GIÁ</h1>${state.subtitle ? `<div class="sub">${esc(state.subtitle)}</div>` : ''}</div>
        <div class="meta">${state.date ? 'Ngày: ' + viDate(state.date) : ''}</div>
      </div>
      ${state.customer ? `<div class="cust">Kính gửi: <b>${esc(state.customer)}</b></div>` : ''}
      <table>
        <thead><tr><th class="c">STT</th><th>Hạng mục</th><th class="c">ĐVT</th><th class="c">SL</th><th class="r">Đơn giá (VNĐ)</th><th class="r">Thành tiền (VNĐ)</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot>${foot}</tfoot>
      </table>
      <div class="words">Bằng chữ: ${numToWords(t.total)}.</div>
      ${state.note ? `<div class="note"><b>Ghi chú:</b> ${esc(state.note)}</div>` : ''}
      <div class="thanks">Cảm ơn Quý khách đã quan tâm!</div>`;
    fitPreview();
  }

  // Thu nhỏ phiếu cho vừa khung xem trước
  function fitPreview() {
    const box = $('previewBox'), sheet = $('sheet');
    const w = box.parentElement.clientWidth;
    if (!w) return;
    const scale = Math.min(1, w / 900);
    sheet.style.transform = `scale(${scale})`;
    box.style.height = (sheet.offsetHeight * scale) + 'px';
  }
  window.addEventListener('resize', fitPreview);

  // ---------- Cập nhật chung ----------
  let timer;
  function update() {
    const t = totals();
    renderSheet(t);
    $('dockTotal').textContent = fmt(t.total) + ' đ';
    $('itemCount').textContent = t.rows.length ? `${t.rows.length} mục · ${fmt(t.subtotal)} đ` : '';
    const ex = [];
    if (t.discount) ex.push('Giảm ' + fmt(t.discount) + ' đ');
    if (t.vatPct) ex.push('VAT ' + state.vat + '%');
    if (state.note) ex.push('Có ghi chú');
    $('extraSum').textContent = ex.join(' · ') || 'Không có';
    $('shopSum').textContent = shop.name || 'Chưa nhập';
    clearTimeout(timer); timer = setTimeout(save, 300);
  }

  // ---------- Xuất ảnh ----------
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }

  async function makeImage() {
    if (!totals().total) { toast('Chưa nhập số lượng và đơn giá'); return null; }
    if (typeof html2canvas === 'undefined') { toast('Cần có mạng để tạo ảnh'); return null; }
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    // Tạm hiện phiếu ở kích thước thật để chụp (kể cả khi đang ở tab Soạn)
    const sheet = $('sheet');
    const clone = sheet.cloneNode(true);
    clone.removeAttribute('id'); clone.id = 'sheet';
    clone.style.cssText = 'transform:none;position:fixed;left:-10000px;top:0';
    sheet.id = 'sheet-live';
    document.body.appendChild(clone);
    try {
      const canvas = await html2canvas(clone, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      return await new Promise(r => canvas.toBlob(r, 'image/png'));
    } finally { clone.remove(); sheet.id = 'sheet'; }
  }
  const fileName = () => {
    const who = (state.customer || state.subtitle || '').trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');
    return `bao-gia${who ? '-' + who : ''}-${(state.date || today())}.png`;
  };
  function download(blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  $('btnDownload').addEventListener('click', async () => {
    toast('Đang tạo ảnh…');
    const blob = await makeImage(); if (!blob) return;
    download(blob); toast('Đã tải ảnh');
  });
  $('btnShare').addEventListener('click', async () => {
    toast('Đang tạo ảnh…');
    const blob = await makeImage(); if (!blob) return;
    const file = new File([blob], fileName(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Bảng báo giá' }); } catch (e) { /* người dùng huỷ */ }
    } else { download(blob); toast('Máy không hỗ trợ chia sẻ, đã tải ảnh về'); }
  });
  $('btnPrint').addEventListener('click', () => {
    const prev = document.body.dataset.tab;
    document.body.dataset.tab = 'preview';
    const sheet = $('sheet'); const tf = sheet.style.transform; sheet.style.transform = 'none';
    window.print();
    sheet.style.transform = tf; document.body.dataset.tab = prev; fitPreview();
  });

  // ---------- Khởi động ----------
  fillForm();
  update();
  if (document.fonts) document.fonts.ready.then(fitPreview);
})();
</script>
</body>
</html>
